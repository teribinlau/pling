# 叮一下 · 只开 HTTP（还没有证书，或者 PLING_TLS=off 的内网试用）
# 注意：微信 / QQ 登录、PWA、桌面版都要求 HTTPS，正式使用请配好证书

include /etc/pling/nginx/upstream.inc;

server {
  listen 80 default_server;
  server_name _;
  server_tokens off;

  # Let's Encrypt 验证
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
    try_files $uri =404;
  }

  # 登录服务在内网取邮件模板
  location /email-templates/ {
    alias /usr/share/nginx/email-templates/;
    default_type text/html;
  }

  set $pling_hsts "";
  include /etc/pling/nginx/app.inc;
}
