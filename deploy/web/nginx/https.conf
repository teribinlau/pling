# 叮一下 · HTTPS（@CERT@ / @KEY@ 由启动脚本换成实际的证书路径）

include /etc/pling/nginx/upstream.inc;

server {
  listen 80 default_server;
  server_name _;
  server_tokens off;

  # Let's Encrypt 验证和续期
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
    try_files $uri =404;
  }

  # 登录服务在内网取邮件模板（http://web/email-templates/…）
  location /email-templates/ {
    alias /usr/share/nginx/email-templates/;
    default_type text/html;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl default_server;
  http2 on;
  server_name _;
  server_tokens off;

  ssl_certificate     @CERT@;
  ssl_certificate_key @KEY@;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  set $pling_hsts "max-age=15552000";
  include /etc/pling/nginx/app.inc;
}
